<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confess Wall — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <style>
    :root {
      --night-1: #150d13;
      --card-bg: #241829;
      --paper: #fdf6ea;
      --paper-deep: #f3e5cd;
      --ink: #372a26;
      --ink-soft: #6d574c;
      --rose: #d94f74;
      --rose-deep: #9e1b40;
      --gold: #c9973f;
      --text: #f5e9dc;
      --text-muted: #a98b97;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fraunces", Georgia, serif;
      color: var(--text);
      background:
        radial-gradient(1000px 700px at 75% -10%, rgba(217, 79, 116, 0.16), transparent 60%),
        radial-gradient(800px 600px at 5% 110%, rgba(201, 151, 63, 0.08), transparent 55%),
        linear-gradient(175deg, #241320, var(--night-1) 65%);
    }

    /* ---------- Auth ---------- */
    .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card {
      width: 100%; max-width: 360px; padding: 2.5rem 2rem; text-align: center;
      background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      box-shadow: 0 25px 50px rgba(8,3,10,0.55);
      animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-card h2 { margin: 0 0 0.4rem; font-weight: 420; font-size: 1.7rem; letter-spacing: -0.01em; }
    .auth-card h2 em { color: var(--rose); font-style: italic; }
    .auth-card p { margin: 0 0 1.6rem; color: var(--text-muted); font-size: 0.95rem; }
    .auth-card input {
      width: 100%; padding: 0.85rem 1rem; margin-bottom: 0.9rem;
      border: 1.5px solid rgba(255,255,255,0.14); border-radius: 10px;
      background: rgba(0,0,0,0.25); color: var(--text); font-family: inherit; font-size: 1rem;
    }
    .auth-card input:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px rgba(217,79,116,0.22); }
    .auth-btn {
      width: 100%; padding: 0.85rem; border: none; border-radius: 999px;
      background: linear-gradient(160deg, #b52a52, var(--rose-deep));
      color: #fff7ee; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .auth-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .auth-error { margin: 0.9rem 0 0; min-height: 1.2em; font-size: 0.88rem; color: #ff9db2; }

    button:focus-visible, input:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }

    /* ---------- Dashboard shell ---------- */
    .dashboard { display: none; max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    .topbar {
      display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
      margin-bottom: 1.6rem; animation: rise 0.5s 0.05s ease both;
    }
    .topbar h1 { margin: 0; font-weight: 400; font-size: 1.9rem; letter-spacing: -0.01em; }
    .topbar h1 em { color: var(--gold); font-style: italic; font-weight: 560; }
    .count-pill {
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted); border: 1px solid rgba(255,255,255,0.12);
      padding: 4px 12px; border-radius: 999px;
    }
    .logout-btn {
      margin-left: auto; background: transparent; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.16); border-radius: 999px;
      color: var(--text-muted); padding: 7px 18px; font-family: inherit; font-size: 0.85rem;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .logout-btn:hover { color: var(--text); border-color: var(--rose); background: rgba(217,79,116,0.1); }

    /* ---------- Master–detail layout ---------- */
    .layout {
      display: grid; grid-template-columns: 250px 1fr; gap: 1.6rem;
      align-items: start; animation: rise 0.55s 0.12s ease both;
    }

    /* small name boxes */
    .tabs {
      display: flex; flex-direction: column; gap: 9px;
      max-height: 68vh; overflow-y: auto; padding: 4px 4px 4px 0;
      scrollbar-width: thin; scrollbar-color: var(--rose-deep) transparent;
    }
    .tab {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 11px 13px; cursor: pointer; text-align: left;
      background: var(--card-bg); color: var(--text);
      border: 1px solid rgba(255,255,255,0.09); border-radius: 11px;
      font-family: inherit; font-size: 0.98rem;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .tab:hover { transform: translateX(3px); border-color: rgba(217,79,116,0.5); }
    .tab .heart-dot { color: var(--rose); font-size: 0.8rem; opacity: 0.75; }
    .tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab[aria-current="true"] {
      border-color: var(--gold); background: linear-gradient(160deg, rgba(217,79,116,0.18), rgba(201,151,63,0.12));
      box-shadow: 0 6px 18px rgba(158,27,64,0.28);
    }
    .tab[aria-current="true"] .heart-dot { opacity: 1; }

    /* stage */
    .stage { position: relative; min-height: 420px; }
    .empty-note {
      display: flex; align-items: center; justify-content: center; min-height: 380px;
      color: var(--text-muted); font-family: "Caveat", cursive; font-size: 1.5rem;
      text-align: center; padding: 2rem; border: 1.5px dashed rgba(255,255,255,0.14); border-radius: 16px;
    }

    /* ---------- The big cute letter ---------- */
    .big-letter {
      position: relative;
      background: linear-gradient(var(--paper), var(--paper-deep));
      color: var(--ink);
      border-radius: 16px;
      padding: 58px 34px 22px;
      box-shadow: 0 30px 70px rgba(8,3,10,0.6);
      animation: pop-in 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    .big-letter::before {
      content: ""; position: absolute; inset: 12px;
      border: 1.5px dashed rgba(55,42,38,0.24); border-radius: 10px; pointer-events: none;
    }
    .seal {
      position: absolute; top: -26px; left: 50%; transform: translateX(-50%) rotate(-6deg);
      width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: #ffe9dd;
      border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%;
      background: radial-gradient(circle at 32% 28%, #d34a70, var(--rose-deep) 58%, #7c1330);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.35), inset 0 -4px 8px rgba(60,5,22,0.55), 0 10px 22px rgba(158,27,64,0.45);
    }
    .seal::before {
      content: ""; position: absolute; inset: 7px; border-radius: inherit;
      border: 1px solid rgba(255,233,221,0.35);
    }

    .letter-to-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-soft); text-align: center;
    }
    .letter-to {
      margin: 4px 0 20px; text-align: center;
      font-style: italic; font-weight: 560; font-size: clamp(1.5rem, 3vw, 2.1rem);
      color: var(--rose-deep); line-height: 1.15; word-break: break-word;
    }
    .divider {
      width: 130px; height: 1px; margin: 0 auto 22px;
      background: linear-gradient(90deg, transparent, rgba(156,36,80,0.55), transparent);
    }
    .letter-message {
      font-family: "Caveat", cursive; font-size: clamp(1.35rem, 2.4vw, 1.7rem);
      line-height: 34px; color: var(--ink); white-space: pre-wrap; word-break: break-word;
      background-image: repeating-linear-gradient(
        to bottom, transparent 0, transparent 33px,
        rgba(55,42,38,0.13) 33px, rgba(55,42,38,0.13) 34px
      );
      padding-top: 4px; min-height: 170px;
    }
    .letter-foot {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      margin-top: 26px; padding-top: 14px; border-top: 1px solid rgba(55,42,38,0.18);
    }
    .letter-date {
      font-size: 0.86rem; color: var(--ink-soft);
      letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
    }
    .foot-heart { color: var(--rose); animation: beat 1.6s ease-in-out infinite; }

    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* actions under the letter */
    .stage-actions { margin-top: 1.2rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
    .export-btn {
      padding: 0.8rem 1.5rem; border: none; border-radius: 999px; cursor: pointer;
      background: linear-gradient(160deg, #b52a52, var(--rose-deep));
      color: #fff7ee; font-family: inherit; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.03em;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .export-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .export-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .hint-line { margin: 0.8rem 0 0; font-family: "Caveat", cursive; font-size: 1.05rem; color: var(--text-muted); }

    /* toast */
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 80px);
      background: var(--card-bg); color: var(--text); border: 1px solid rgba(217,79,116,0.5);
      padding: 10px 20px; border-radius: 999px; font-size: 0.9rem;
      opacity: 0; pointer-events: none; transition: transform 0.3s ease, opacity 0.3s ease; z-index: 50;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* export mode: keep the wax seal fully inside the captured frame */
    .big-letter.export-mode {
      padding-top: 92px;
      background-image: linear-gradient(#fdf6ea, #f3e5cd);
    }
    .big-letter.export-mode .seal { top: 20px; }
    .big-letter.export-mode,
    .big-letter.export-mode * {
      animation: none !important;
      transition: none !important;
    }
    .offscreen {
      position: fixed !important;
      left: -12000px !important;
      top: 0 !important;
      z-index: -1;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .tabs { flex-direction: row; flex-wrap: wrap; max-height: none; overflow: visible; }
      .tab { width: auto; flex: 1 1 auto; }
      .big-letter { padding: 52px 20px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .foot-heart { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Auth -->
  <div class="auth-screen" id="auth-screen">
    <div class="auth-card">
      <h2>Confess <em>Wall</em> Admin</h2>
      <p>Enter the admin password to continue</p>
      <form id="login-form">
        <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password">
        <button type="submit" class="auth-btn">Unlock</button>
      </form>
      <p class="auth-error" id="auth-error" role="alert"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="topbar">
      <h1>Confessions <em>&amp; letters</em></h1>
      <span class="count-pill" id="confession-count">0 total</span>
      <button class="logout-btn" id="logout">Logout</button>
    </div>

    <div class="layout">
      <nav class="tabs" id="tabs" aria-label="Confessions by sender"></nav>

      <section class="stage">
        <div class="empty-note" id="empty-note">Pick a name on the side<br>to open their letter &#9829;</div>

        <article class="big-letter" id="big-letter" hidden aria-live="polite">
          <div class="seal" aria-hidden="true">&#9829;</div>
          <p class="letter-to-label">To</p>
          <p class="letter-to" id="letter-to"></p>
          <div class="divider" aria-hidden="true"></div>
          <div class="letter-message" id="letter-message"></div>
          <footer class="letter-foot">
            <span class="letter-date" id="letter-date"></span>
            <span class="foot-heart" aria-hidden="true">&#9829;</span>
          </footer>
        </article>

        <div class="stage-actions">
          <button class="export-btn" id="save-png" disabled>Save this letter as PNG</button>
        </div>
        <p class="hint-line">tip: select a name first, then save the opened letter as an image</p>
      </section>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const ADMIN_PASSWORD = 'chaddy';

    const authScreen = document.getElementById('auth-screen');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('admin-password');
    const authError = document.getElementById('auth-error');
    const logoutBtn = document.getElementById('logout');

    const tabsEl = document.getElementById('tabs');
    const emptyNote = document.getElementById('empty-note');
    const bigLetter = document.getElementById('big-letter');
    const letterTo = document.getElementById('letter-to');
    const letterMessage = document.getElementById('letter-message');
    const letterDate = document.getElementById('letter-date');
    const countPill = document.getElementById('confession-count');
    const saveBtn = document.getElementById('save-png');
    const toast = document.getElementById('toast');

    let confessions = [];
    let selected = null;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderTabs() {
      tabsEl.innerHTML = '';
      confessions.forEach((c, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab';
        btn.dataset.index = i;
        const dot = document.createElement('span');
        dot.className = 'heart-dot';
        dot.textContent = '\u2665';
        dot.setAttribute('aria-hidden', 'true');
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = c.from || 'Anonymous';
        btn.append(dot, name);
        btn.addEventListener('click', () => selectConfession(i, btn));
        tabsEl.appendChild(btn);
      });
      countPill.textContent = `${confessions.length} total`;
    }

    function selectConfession(index, tabEl) {
      selected = index;
      const c = confessions[index];
      tabsEl.querySelectorAll('.tab').forEach(t => t.removeAttribute('aria-current'));
      tabEl.setAttribute('aria-current', 'true');
      emptyNote.style.display = 'none';
      bigLetter.hidden = false;

      letterTo.textContent = c.to || 'Someone special';
      letterMessage.textContent = c.message || '';
      letterDate.textContent = c.date || '';
      saveBtn.disabled = false;

      bigLetter.style.animation = 'none';
      void bigLetter.offsetWidth;
      bigLetter.style.animation = '';

      if (window.innerWidth <= 760) {
        bigLetter.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authError.textContent = '';
      if (passwordInput.value.trim() !== ADMIN_PASSWORD) {
        authError.textContent = 'Incorrect password.';
        return;
      }
      try {
        const res = await fetch('/admin/data');
        if (!res.ok) throw new Error('server error');
        confessions = await res.json();
      } catch {
        authError.textContent = 'Could not load confessions.';
        return;
      }
      authScreen.style.display = 'none';
      dashboard.style.display = 'block';
      renderTabs();
      if (confessions.length === 0) {
        emptyNote.innerHTML = 'No confessions yet.<br>they will appear here &#9829;';
      }
    });

    logoutBtn.addEventListener('click', () => {
      confessions = [];
      selected = null;
      tabsEl.innerHTML = '';
      bigLetter.hidden = true;
      emptyNote.style.display = 'flex';
      emptyNote.innerHTML = 'Pick a name on the side<br>to open their letter &#9829;';
      saveBtn.disabled = true;
      passwordInput.value = '';
      dashboard.style.display = 'none';
      authScreen.style.display = 'flex';
    });

    saveBtn.addEventListener('click', async () => {
      if (typeof html2canvas === 'undefined') {
        showToast('Image library still loading, try again.');
        return;
      }
      if (selected === null) return;

      saveBtn.disabled = true;
      showToast('Rendering your square letter \u2665');

      try {
        // capture a hidden clone so the wax seal is never clipped
        const clone = bigLetter.cloneNode(true);
        clone.classList.add('export-mode');
        clone.classList.add('offscreen');
        clone.style.width = bigLetter.offsetWidth + 'px';
        document.body.appendChild(clone);

        const raw = await html2canvas(clone, {
          useCORS: true,
          scale: 2,
          logging: false,
          backgroundColor: null
        });
        clone.remove();

        if (!raw || !raw.width || !raw.height) {
          throw new Error('capture was empty');
        }

        // composite onto a 1:1 canvas
        const pad = Math.round(Math.max(raw.width, raw.height) * 0.09);
        const side = Math.max(raw.width, raw.height) + pad * 2;
        const out = document.createElement('canvas');
        out.width = side;
        out.height = side;
        const ctx = out.getContext('2d');

        const bg = ctx.createLinearGradient(0, 0, side * 0.09, side);
        bg.addColorStop(0, '#241320');
        bg.addColorStop(0.65, '#150d13');
        bg.addColorStop(1, '#150d13');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, side, side);

        const glow = ctx.createRadialGradient(side * 0.75, 0, 10, side * 0.75, 0, side * 0.62);
        glow.addColorStop(0, 'rgba(217,79,116,0.16)');
        glow.addColorStop(1, 'rgba(217,79,116,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, side, side);

        const glow2 = ctx.createRadialGradient(side * 0.05, side, 10, side * 0.05, side, side * 0.55);
        glow2.addColorStop(0, 'rgba(201,151,63,0.08)');
        glow2.addColorStop(1, 'rgba(201,151,63,0)');
        ctx.fillStyle = glow2;
        ctx.fillRect(0, 0, side, side);

        const hearts = [
          { x: 0.14, y: 0.16, s: 0.030, c: 'rgba(217,79,116,0.75)', r: -0.2 },
          { x: 0.86, y: 0.13, s: 0.024, c: 'rgba(201,151,63,0.7)', r: 0.25 },
          { x: 0.82, y: 0.86, s: 0.028, c: 'rgba(217,79,116,0.65)', r: 0.15 },
          { x: 0.15, y: 0.84, s: 0.022, c: 'rgba(201,151,63,0.6)', r: -0.3 },
          { x: 0.5, y: 0.09, s: 0.02, c: 'rgba(217,79,116,0.45)', r: 0 }
        ];
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        hearts.forEach(h => {
          ctx.save();
          ctx.translate(side * h.x, side * h.y);
          ctx.rotate(h.r);
          ctx.font = `${Math.round(side * h.s)}px serif`;
          ctx.fillStyle = h.c;
          ctx.fillText('\u2665', 0, 0);
          ctx.restore();
        });

        const maxW = side - pad * 2;
        const scale = Math.min(maxW / raw.width, maxW / raw.height);
        const w = raw.width * scale;
        const hh = raw.height * scale;
        ctx.shadowColor = 'rgba(8,3,10,0.55)';
        ctx.shadowBlur = pad * 0.5;
        ctx.shadowOffsetY = pad * 0.18;
        ctx.drawImage(raw, (side - w) / 2, (side - hh) / 2, w, hh);
        ctx.shadowColor = 'transparent';

        ctx.font = `${Math.round(side * 0.034)}px Caveat, cursive`;
        ctx.fillStyle = 'rgba(245,233,220,0.65)';
        ctx.fillText('\u2665 Confess Wall', side / 2, side - pad * 0.66);

        ctx.font = `${Math.round(side * 0.024)}px Fraunces, Georgia, serif`;
        ctx.fillStyle = 'rgba(201,151,63,0.8)';
        const brand = 'IT KNOWS';
        const spaced = brand.split('').join(' ');
        ctx.fillText(spaced, side / 2 + side * 0.012, side - pad * 0.34);

        const link = document.createElement('a');
        link.download = `confession-${selected + 1}.png`;
        link.href = out.toDataURL('image/png');
        link.click();
        showToast('Saved as a perfect square \u2665');
      } catch (err) {
        showToast('Export failed: ' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
