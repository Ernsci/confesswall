<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confess Wall — Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <style>
    :root {
      --admin-bg: #1a121f;
      --admin-card: #24182b;
      --admin-accent: #c9973f;
      --admin-accent-hover: #b52a52;
      --admin-text: #f5e9dc;
      --admin-text-muted: #a98b97;
    }
    body { font-family: "Caveat", cursive, sans-serif; background: var(--admin-bg); color: var(--admin-text); margin: 0; min-height: 100vh; }
    a { color: var(--admin-accent); text-decoration: none; }
    a:hover { color: var(--admin-accent-hover); }
    .dashboard { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .dashboard .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .dashboard h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.8rem; margin: 0; color: var(--admin-text); }
    .dashboard .count { color: var(--admin-text-muted); font-size: 0.88rem; }
    .dashboard .logout { align-self: flex-end; }
    .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--admin-text-muted); padding: 0.5rem 0.8rem; border-radius: 6px; font-size: 0.82rem; cursor: pointer; transition: all 0.15s ease; }
    .logout-btn:hover { background: rgba(255,255,255,0.06); color: var(--admin-text); }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .letter-card { background: var(--admin-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1.8rem 1.5rem; margin: 0; transition: box-shadow 0.2s ease; }
    .letter-card:hover { box-shadow: 0 8px 25px rgba(8,3,10,0.4); }
    .letter-card .letter-header { font-family: "Fraunces", Georgia, serif; font-size: 1.15rem; color: var(--admin-accent); text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: 0.6rem; }
    .letter-card .letter-body { font-family: "Caveat", cursive; font-size: 0.95rem; line-height: 1.5; color: var(--admin-text); margin-bottom: 0.8rem; }
    .letter-card .meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.72rem; color: var(--admin-text-muted); }
    .letter-card .date { font-family: "Fraunces", Georgia, serif; color: var(--admin-accent); }
    .letter-card .sent { opacity: 0.6; }
    .export-btn { margin-top: 1.5rem; padding: 0.85rem 1.4rem; border: none; border-radius: 999px; background: var(--admin-accent); color: #fff7ee; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease; }
    .export-btn:hover { background: var(--admin-accent-hover); transform: translateY(-1px); }
    .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    @media (prefers-reduced-motion: reduce) { .export-btn { transition: none; } }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>Confessions</h1>
      <div class="count" id="confession-count">0</div>
      <button class="logout-btn" id="logout">Logout</button>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
    <div style="margin-top: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap;">
      <button class="export-btn" id="download-png">Save as PNG</button>
      <button class="export-btn" id="download-all">Download All as PNG</button>
    </div>
    <p class="hint" style="margin-top: 1rem; color: var(--admin-text-muted); font-size: 0.78rem;">
      Press “Download All as PNG” to capture the full grid. Images may be tall for long messages.
    </p>
  </div>

  <script>
    const ADMIN_CONFESSIONS = [];

    const cardsGrid = document.getElementById('cards-grid');
    const confessionCount = document.getElementById('confession-count');
    const downloadPng = document.getElementById('download-png');
    const downloadAll = document.getElementById('download-all');

    function renderConfession(cardData) {
      const safeFrom = cardData.from.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
      const safeMessage = cardData.message.replace(/&/g, '&').replace(/</g, '>').replace(/\n/g, '<br>');
      return `
        <div class="letter-card">
          <div class="letter-header">To: ${safeFrom}</div>
          <div class="letter-body">${safeMessage}</div>
          <div class="letter-date">${cardData.date}</div>
        </div>
      `;
    }

    function renderGrid() {
      cardsGrid.innerHTML = '';
      if (ADMIN_CONFESSIONS.length === 0) {
        cardsGrid.innerHTML = '<p style="color:var(--admin-text-muted); text-align:center; padding:2rem;">No confessions yet.</span>';
        return;
      }
      const count = Math.min(ADMIN_CONFESSIONS.length, 20);
      confessionCount.textContent = count;
      for (let i = 0; i < count; i++) {
        cardsGrid.innerHTML += renderConfession(ADMIN_CONFESSIONS[i]);
      }
    }

    // Fetch confessions from server API
    fetch('/admin/data')
      .then(r => r.json())
      .then(data => { ADMIN_CONFESSIONS.splice(0, ADMIN_CONFESSIONS.length, ...data); renderGrid(); })
      .then(() => { if (ADMIN_CONFESSIONS.length > 0) { document.getElementById('confession-count').textContent = Math.min(ADMIN_CONFESSIONS.length, 20); }; });

    function captureGridToPNG(selector, filename) {
      const element = document.querySelector(selector);
      if (!element) return alert('Grid not found.');
      html2canvas(element, { useCORS: true, scale: 2, logging: false })
        .then(canvas => {
          const link = document.createElement('a');
          link.download = filename || 'confession-admin.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        })
        .catch(err => alert('PNG export failed: ' + err.message));
    }

    downloadPng.addEventListener('click', () => {
      captureGridToPNG('.cards-grid', 'single-confession.png');
    });

    downloadAll.addEventListener('click', () => {
      captureGridToPNG('.cards-grid', 'all-confessions.png');
    });
  </script>
</body>
</html>
