<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confess Wall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrapper">
    <header class="hero">
      <h1>Confess Wall</h1>
      <p>Say what your heart has been holding in.</p>
    </header>

    <form id="confess-form" class="card" novalidate>
      <div class="field">
        <label for="from">Enter your Name</label>
        <input type="text" id="from" name="from" maxlength="60" placeholder="Your name" autocomplete="off" required>
        <p class="hint">Don't worry, your identity is safe from us.</p>
      </div>

      <div class="field">
        <label for="to">To</label>
        <input type="text" id="to" name="to" maxlength="60" placeholder="Who is this confession for?" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="8" placeholder="Write your confession..." required></textarea>
        <p class="counter"><span id="word-count">0</span> / 1000 words</p>
      </div>

      <button type="submit" id="submit-btn">Send Confession</button>

      <p class="status" id="status" role="alert" hidden></p>
    </form>

    <section class="card success-card" id="success-card" hidden>
      <div class="success-icon">&#10084;</div>
      <h2>Your confession has been sent</h2>
      <p>Thank you for opening up.</p>
      <button type="button" id="another-btn">Send another</button>
    </section>

    <footer class="footnote">Be kind with your words.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
