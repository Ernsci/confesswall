<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Confess Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 2rem; font-family: "Caveat", cursive, sans-serif; background: #150d13; color: #f5e9dc; }
    h2 { text-align: center; margin-bottom: 1rem; }
    .prompt { background: #241320; padding: 2rem; border-radius: 8px; max-width: 360px; margin: 2rem auto; }
    .prompt input { width: 100%; padding: 0.6rem; margin-top: 0.5rem; box-sizing: border-box; }
    .prompt button { width: 100%; margin-top: 1rem; padding: 0.6rem; }
    .panel { max-width: 600px; margin: 2rem auto; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .theme-btn { flex: 1; padding: 0.5rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .theme-btn.happy { background: #fda4af; color: #150d13; }
    .theme-btn.sad { background: #a3a9ad; color: #150d13; }
    .theme-btn.love { background: #f472b6; color: #150d13; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; }
    .field input, .field textarea { width: 100%; padding: 0.6rem; box-sizing: border-box; border: 1.5px solid rgba(55,42,38,0.32); border-radius: 8px; background: #fffaf1; color: #372a26; font-family: inherit; }
    .field textarea { min-height: 100px; resize: vertical; }
    canvas { border: 1px solid #ffe9dd; background: #150d13; }
    #status { margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>

  <!-- Password prompt -->
  <div class="prompt" id="password-prompt">
    <h2>Confess Wall Admin</h2>
    <p>Enter password:</p>
    <input type="password" id="pwd" placeholder="chaddy">
    <button id="login">Login</button>
    <p id="status" style="margin-top 0.5rem; font-size:0.8rem;"></p>
  </div>

  <!-- Admin panel (hidden until login) -->
  <div class="panel" id="admin-panel" style="display:none;">
    <h2>Create Confession PNG</h2>

    <div class="controls">
      <button class="theme-btn happy" data-theme="happy">Happy</button>
      <button class="theme-btn sad" data-theme="sad">Sad</button>
      <button class="theme-btn love" data-theme="love">Love</button>
    </div>

    <div class="field">
      <label for="to">To</label>
      <input type="text" id="to" placeholder="Your name" required>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Write your confession..." required></textarea>
    </div>

    <canvas id="confession-canvas" width="400" height="200" style="display:none; margin-top:1rem;"></canvas>

    <button id="save-btn" style="width:100%; margin-top:1rem;">Save as PNG</button>
    <p id="status" style="margin-top:0.5rem; text-align:center;"></p>
  </div>

  <script>
    // ----- Password check -----
    const correct = 'chaddy';
    const pwdInput = document.getElementById('pwd');
    const loginBtn = document.getElementById('login');
    const prompt = document.getElementById('password-prompt');
    const panel = document.getElementById('admin-panel');
    const status = document.getElementById('status');

    loginBtn.addEventListener('click', () => {
      if (pwdInput.value.trim() === correct) {
        prompt.style.display = 'none';
        panel.style.display = 'block';
      } else {
        status.textContent = 'Incorrect password.';
        status.style.color = 'red';
      }
    });

    // ----- Theme switching -----
    const canvas = document.getElementById('confession-canvas');
    const ctx = canvas.getContext('2d');
    const themes = {
      happy: { bg: '#fff7ee', text: '#d94f74', fontColor: '#150d13' },
      sad:   { bg: '#e0e7ef', text: '#4a5568', fontColor: '#150d13' },
      love:  { bg: '#fdf2f8', text: '#d94f74', fontColor: '#150d13' }
    };
    let current = 'happy';

    function setTheme(t) {
      current = t;
      const {bg, text, fontColor} = themes[t];
      document.body.style.background = bg;
      document.body.style.color = text;
      ctx.fillStyle = text;
      ctx.fillRect(0,0,canvas.width,canvas.height); // clear
      drawCanvas();
    }
    document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));

    // ----- Canvas drawer -----
    function drawCanvas() {
      const to = document.getElementById('to').value.trim() || 'Anonymous';
      const msg = document.getElementById('message').value.trim() || '';
      // clear with bg
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = themes[current].text;
      ctx.font = 'bold 28px "Fraunces", Georgia, serif';
      ctx.fillText(`To: ${to}`, 20, 50);
      ctx.font = 'bold 20px "Fraunces", Georgia, serif';
      const lines = msg.split('\n');
      let y = 120;
      lines.forEach(line => {
        ctx.fillText(`Message: ${line}`, 20, y);
        y += 38;
      });
    }

    // redraw on input
    document.getElementById('to').addEventListener('input', drawCanvas);
    document.getElementById('message').addEventListener('input', drawCanvas);

    // ----- Save PNG -----
    const saveBtn = document.getElementById('save-btn');
    saveBtn.addEventListener('click', () => {
      const dataURL = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataURL;
      link.download = 'confession.png';
      link.click();
      status.textContent = 'Saved as confession.png';
      status.style.color = 'green';
    });
  </script>
</body>
</html>
